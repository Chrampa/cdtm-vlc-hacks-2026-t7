[project]
name = "talent-matcher"
version = "0.1.0"
description = "AI Talent Matcher — find the right people already inside the company (NTT DATA case, CDTM Valencia Hacks 2026, team T7)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "duckdb>=1.1",
  "numpy>=2.0",
  "scipy>=1.14",
  "httpx>=0.27",
  "pydantic>=2.9",
  "rapidfuzz>=3.10",
  "ortools>=9.11",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
